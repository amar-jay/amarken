[project]
name = "amarken"
version = "0.1.0"
description = "amarken: a series of finetuned models."
readme = "README.md"
authors = [{ name = "amar-jay", email = "abdelmanan.abdelrahman03@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35",
  "datasets>=5.1.0",
  "matplotlib>=3.8",
  "peft>=0.21.2",
  "torch>=2.6",
  "torchvision>=0.29.1",
  "tqdm>=4.70.1",
  "wandb>=0.22",
  "transformers>=4.56",
  "trl>=1.16.0",
]

[project.scripts]
amarken = "amarken:main"


[project.urls]
Repository = "https://github.com/amar-jay/amarken"
Issues = "https://github.com/amar-jay/amarken/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "poethepoet>=0.49.0",
    "ruff>=0.17.2",
]

[tool.poe.tasks]
test = "python -m unittest discover -s tests -v"
lint = "ruff check ."
format = "ruff format ."