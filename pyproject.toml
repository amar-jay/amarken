[project]
name = "amarken"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "amar-jay", email = "abdelmanan.abdelrahman03@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "datasets>=5.1.0",
  "peft>=0.21.2",
  "torch>=2.6",
  "torchvision>=0.29.1",
  "tqdm>=4.70.1",
  "transformers>=4.56",
]

[project.scripts]
amarken = "amarken:main"


[project.urls]
Repository = "https://github.com/amar-jay/amarken"
Issues = "https://github.com/amar-jay/amarken/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
